plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.tapgame'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.numbergate'
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName '3.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
