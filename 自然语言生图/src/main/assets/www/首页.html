<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <title>自然语言生图</title>
    <link rel="stylesheet" href="样式.css">
</head>
<body>
    <div id="app">
        <header id="topbar">
            <b id="title">创作</b>
            <span id="queue-chip" class="badge acc" hidden></span>
            <button class="icon-btn" id="btn-settings" aria-label="设置">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
            </button>
        </header>

        <main id="views">
            <section id="view-create" class="view"></section>
            <section id="view-batch" class="view" hidden></section>
            <section id="view-gallery" class="view" hidden></section>
        </main>

        <nav id="tabbar">
            <button data-tab="create" class="on">
                <svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg><span>创作</span>
            </button>
            <button data-tab="batch">
                <svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.2"/><circle cx="4.5" cy="12" r="1.2"/><circle cx="4.5" cy="18" r="1.2"/></svg><span>批量</span>
            </button>
            <button data-tab="gallery">
                <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 16l5-5 4 4 3-3 6 6"/><circle cx="15.5" cy="8.5" r="1.5"/></svg><span>图库</span>
            </button>
        </nav>
    </div>

    <div id="layers"></div>

    <!-- 顺序：底层能力 → 数据 → 各页面 → 启动 -->
    <script src="桥接.js"></script>
    <script src="存储.js"></script>
    <script src="参数.js"></script>
    <script src="接口.js"></script>
    <script src="写词.js"></script>
    <script src="出图.js"></script>
    <script src="计价.js"></script>
    <script src="队列.js"></script>
    <script src="图库.js"></script>
    <script src="工具.js"></script>
    <script src="说明.js"></script>
    <script src="页面-设置.js"></script>
    <script src="主题.js"></script>
    <script src="风格.js"></script>
    <script src="自定义提示词.js"></script>
    <script src="页面-创作.js"></script>
    <script src="规划.js"></script>
    <script src="页面-批量.js"></script>
    <script src="快捷栏.js"></script>
    <script src="多角色.js"></script>
    <script src="参考图.js"></script>
    <script src="角色参考.js"></script>
    <script src="页面-图库.js"></script>
    <script src="备份.js"></script>
    <script src="更新.js"></script>
    <script src="标签库.js"></script>
    <script src="标签说明.js"></script>
    <script src="提示词编辑.js"></script>
    <script src="通配符.js"></script>
    <script src="参数预设.js"></script>
    <script src="角色库.js"></script>
    <script src="角色生成.js"></script>
    <script src="衣柜.js"></script>
    <script src="写真.js"></script>
    <script src="图库角色.js"></script>
    <script src="图生图.js"></script>
    <script src="图像工具.js"></script>
    <script src="对话改词.js"></script>
    <script src="说明-内容.js"></script>
    <script src="启动.js"></script>
</body>
</html>
