<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <title>酒馆询问机</title>
    <link rel="stylesheet" href="样式.css">
</head>
<body>
    <div id="app">
        <header id="topbar">
            <button class="icon-btn" id="btn-drawer" aria-label="对话列表">
                <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
            </button>
            <button id="chat-title" class="title-btn" aria-label="重命名对话">新对话</button>
            <button id="switch-chip" class="chip" aria-label="切换接口、模型、预设">
                <span id="chip-model">未设置接口</span>
                <span id="chip-preset"></span>
            </button>
            <button class="icon-btn" id="btn-settings" aria-label="设置">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
            </button>
        </header>

        <main id="msgs"></main>

        <footer id="composer">
            <textarea id="input" rows="1" placeholder="问点什么…"></textarea>
            <button id="btn-send" class="send-btn" aria-label="发送">
                <svg class="i-send" viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
                <svg class="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>
            </button>
        </footer>
    </div>

    <div id="layers"></div>

    <script src="依赖/marked.min.js"></script>
    <script src="依赖/purify.min.js"></script>
    <script src="桥接.js"></script>
    <script src="存储.js"></script>
    <script src="预设.js"></script>
    <script src="接口.js"></script>
    <script src="界面.js"></script>
</body>
</html>
