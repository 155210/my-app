name: Build 自然语言生图 APK

on:
  push:
    branches: [main]
    paths:
      - '自然语言生图/**'
      - '.github/workflows/自然语言生图.yml'
  # PR 上只打包、上传到 Actions 附件，方便合并前先装上试；不发 Release
  pull_request:
    paths:
      - '自然语言生图/**'
      - '.github/workflows/自然语言生图.yml'
  workflow_dispatch:

permissions:
  contents: write

# 模块目录是中文名，强制 UTF-8，避免 Java/Gradle 读不了中文路径
env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # ubuntu 运行器自带 Android SDK（$ANDROID_HOME），无需额外安装
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 打包 自然语言生图 APK
        run: gradle :自然语言生图:assembleRelease --no-daemon

      # GitHub 会把 Release 附件名里的中文删掉（变成 default.apk），所以文件名用英文，
      # 发布后再把显示名（label）设成「自然语言生图.apk」
      - name: 改名
        run: cp 自然语言生图/build/outputs/apk/release/*.apk NlImage.apk

      - uses: actions/upload-artifact@v4
        with:
          name: 自然语言生图
          path: NlImage.apk

      # 发布到 Releases：手机浏览器打开仓库 Releases 页面就能直接下载 APK
      - name: 发布
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: shengtu-${{ github.run_number }}
          name: 自然语言生图 build ${{ github.run_number }}
          make_latest: true
          files: NlImage.apk

      - name: 附件显示中文名
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api repos/${{ github.repository }}/releases/tags/shengtu-${{ github.run_number }} --jq '.assets[] | select(.name=="NlImage.apk") | .id')
          gh api -X PATCH repos/${{ github.repository }}/releases/assets/$id -f label='自然语言生图.apk' >/dev/null
