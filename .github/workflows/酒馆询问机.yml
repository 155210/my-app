name: Build 酒馆询问机 APK

on:
  push:
    branches: [main]
    paths:
      - '酒馆询问机/**'
      - '.github/workflows/酒馆询问机.yml'
  workflow_dispatch:

permissions:
  contents: write

# 模块目录是中文名，强制 UTF-8，避免 Java/Gradle 读不了中文路径
env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # ubuntu 运行器自带 Android SDK（$ANDROID_HOME），无需额外安装
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 打包 酒馆询问机 APK
        run: gradle :酒馆询问机:assembleRelease --no-daemon

      - name: 改名
        run: cp 酒馆询问机/build/outputs/apk/release/*.apk 酒馆询问机.apk

      - uses: actions/upload-artifact@v4
        with:
          name: 酒馆询问机
          path: 酒馆询问机.apk

      # 发布到 Releases：手机浏览器打开仓库 Releases 页面就能直接下载 APK
      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          tag_name: asker-${{ github.run_number }}
          name: 酒馆询问机 build ${{ github.run_number }}
          make_latest: true
          files: 酒馆询问机.apk
