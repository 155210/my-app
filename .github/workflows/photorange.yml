name: Build 照片按月复制 APK

on:
  push:
    # main 和 claude/ 开头的分支都打包并发 Release，手机上不用等合并就能装
    branches: [main, 'claude/**']
    paths:
      - 'photorange/**'
      - '.github/workflows/photorange.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # ubuntu 运行器自带 Android SDK（$ANDROID_HOME），无需额外安装
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 打包 照片按月复制 APK
        run: |
          set -o pipefail
          gradle :photorange:assembleRelease --no-daemon 2>&1 | tee build.log

      # 编译失败时把错误行挂成注解，不用下载日志就能在 Actions 页面直接看到哪一行错了
      - name: 报告编译错误
        if: failure()
        run: |
          grep -nE "error:|ERROR|e: |What went wrong|\.java:[0-9]+:" -A3 build.log | head -120 > errs.txt || true
          if [ ! -s errs.txt ]; then tail -60 build.log > errs.txt; fi
          msg=$(sed -e 's/%/%25/g' -e 's/\r/%0D/g' errs.txt | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Build failed::$msg"

      # GitHub 会把 Release 附件名里的中文删掉，所以文件名用英文，发布后再把显示名设成中文
      - name: 改名
        run: cp photorange/build/outputs/apk/release/*.apk PhotoRange.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PhotoRange
          path: PhotoRange.apk

      # 发布到 Releases：手机浏览器打开仓库 Releases 页面就能直接下载 APK
      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          tag_name: photorange-${{ github.run_number }}
          name: 照片按月复制 build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: ${{ github.ref == 'refs/heads/main' }}
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          files: PhotoRange.apk

      - name: 附件显示中文名
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api repos/${{ github.repository }}/releases/tags/photorange-${{ github.run_number }} --jq '.assets[] | select(.name=="PhotoRange.apk") | .id')
          gh api -X PATCH repos/${{ github.repository }}/releases/assets/$id -f label='照片按月复制.apk' >/dev/null
