name: Build 自制ai工具箱 APK

on:
  push:
    branches: [main]
    paths:
      - 'toolbox/**'
      - '.github/workflows/toolbox.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # ubuntu 运行器自带 Android SDK（$ANDROID_HOME），无需额外安装
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build 自制ai工具箱 APK
        run: gradle :toolbox:assembleRelease --no-daemon

      - name: Rename APK
        run: cp toolbox/build/outputs/apk/release/toolbox-release.apk AiToolbox.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AiToolbox
          path: AiToolbox.apk

      # 发布到 Releases：手机浏览器打开仓库 Releases 页面就能直接下载 APK（不用登录、不是 zip）
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: toolbox-${{ github.run_number }}
          name: 自制ai工具箱 build ${{ github.run_number }}
          make_latest: true
          files: AiToolbox.apk
