plugins {
    id 'com.android.application'
}

// 每次 Actions 构建自动递增版本号，新版可以直接覆盖安装
def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'com.example.photorange'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.photorange'
        minSdk 24
        targetSdk 34
        versionCode runNumber
        versionName "1.0.${runNumber}"
    }

    // 固定签名：新版可直接覆盖安装，设置保留
    signingConfigs {
        fixed {
            storeFile file('photorange.keystore')
            storePassword 'photorange123'
            keyAlias 'photorange'
            keyPassword 'photorange123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixed
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding 'UTF-8'
    }
}
